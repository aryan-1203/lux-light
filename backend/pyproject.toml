[project]
name = "dawnlit-backend"
version = "1.0.0"
description = "Dawnlit D2C storefront + admin API (FastAPI)"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "N", "S", "PT", "DTZ", "T20", "PIE", "RET", "TID"]
ignore = [
  "B008",   # FastAPI Depends()/Query() in argument defaults is the framework idiom
  "RUF001", # allow typographic characters (₹, —, ·) in strings
  "RUF002",
  "RUF003",
  "S101",   # asserts are used in tests (scoped below) and for type narrowing
]

[tool.ruff.lint.per-file-ignores]
"app/core/errors.py" = ["N818"]  # frozen class names (PLAN §4.1)
"tests/**" = ["S105", "S106", "S311", "S608", "PT011"]
"alembic/versions/**" = ["E501"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = false
files = ["app"]
exclude = ["^\\.venv/", "^storage/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "nh3.*", "time_machine.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]
markers = [
  "contract_strict: strict OpenAPI diff against docs/openapi.yaml (runs only with CONTRACT_STRICT=1)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seeds/__main__.py"]
