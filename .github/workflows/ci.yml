name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository (artifacts use the job token implicitly).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  MYSQL_ROOT_PASSWORD: root
  # Local-only CI credentials for the throwaway MySQL service container.
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/luxlight
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/luxlight_test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # -------------------------------------------------------------------------------------------
  backend:
    name: Backend (ruff · mypy · alembic · pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: luxlight_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies (.venv, same layout as local gates)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Create application database
        run: >-
          docker exec ${{ job.services.mysql.id }}
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS luxlight CHARACTER SET utf8mb4"

      - name: Ruff lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy (strict)
        run: .venv/bin/mypy app

      - name: Alembic upgrade head (+ downgrade/upgrade round-trip)
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Seeds (twice — idempotency)
        run: |
          .venv/bin/python -m app.seeds
          .venv/bin/python -m app.seeds

      - name: Pytest with coverage
        run: .venv/bin/pytest --cov=app --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=pytest-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/pytest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------
  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm run test -- --run
      - name: Production build
        env:
          VITE_API_MOCK: "false"
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -------------------------------------------------------------------------------------------
  contract:
    name: API contract (generated types + strict OpenAPI diff)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: luxlight_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Generated TS types match docs/openapi.yaml
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Live app.openapi() == contract (CONTRACT_STRICT=1)
        working-directory: backend
        env:
          CONTRACT_STRICT: "1"
        run: .venv/bin/pytest tests/test_contract.py

      - name: Frontend typechecks against the live schema
        run: |
          backend/.venv/bin/python backend/scripts/export_openapi.py > "$RUNNER_TEMP/live-openapi.json"
          cd frontend
          npx openapi-typescript "$RUNNER_TEMP/live-openapi.json" -o src/api/schema.live.d.ts
          npm run typecheck
          rm -f src/api/schema.live.d.ts

  # -------------------------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright, mock gateway)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: luxlight
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # PLAN §5 "E2E runtime"
      ENV: test
      OTP_DEV_ECHO: "true"
      PAYMENT_PROVIDER: mock
      CORS_ORIGINS: http://localhost:4173
      PUBLIC_SITE_URL: http://localhost:4173
      STORAGE_DIR: ${{ github.workspace }}/backend/storage
      VITE_API_MOCK: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend — install, migrate, seed (essential + demo)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/alembic upgrade head
          .venv/bin/python -m app.seeds --all

      - name: Backend — start API (:8000) and wait for health
        working-directory: backend
        run: |
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/uvicorn.log"; exit 1

      - name: Frontend — install deps + Playwright Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # playwright.config.ts builds the SPA and serves it with `vite preview` on :4173 (proxy → :8000).
      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log
          path: ${{ runner.temp }}/uvicorn.log
          retention-days: 7

  # -------------------------------------------------------------------------------------------
  docker:
    name: Docker images build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          SITE_DOMAIN=ci.example.invalid ACME_EMAIL=ci@example.invalid \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-contexts: |
            infra=./infra
          push: false
          load: true
          tags: dawnlit-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: dawnlit-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-check images
        run: |
          docker run --rm --entrypoint python dawnlit-backend:ci -c "import app.main; print('backend import ok')"
          docker run --rm --entrypoint id dawnlit-backend:ci
          docker run --rm dawnlit-frontend:ci nginx -t
