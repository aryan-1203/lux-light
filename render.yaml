# Render Blueprint: New → Blueprint → pick this repo. Fill the `sync: false` values when prompted.
services:
  - type: web
    name: lamp-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore # closest Render region to India
    plan: starter # persistent disks require a paid plan
    healthCheckPath: /api/health
    # Single instance only: the rate limiter, dedupe index and outbox live in this one process/disk.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: OUTBOX_PATH
        value: /var/data/outbox.sqlite3
      - key: LEADS_TAB
        value: Leads
      - key: NEWSLETTER_TAB
        value: Newsletter
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-site.vercel.app,https://www.yourdomain.in
      - key: GOOGLE_SERVICE_ACCOUNT_B64
        sync: false
      - key: LEADS_SHEET_ID
        sync: false
      - key: NEWSLETTER_SHEET_ID
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
