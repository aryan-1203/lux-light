# Dawnlit — nginx server config for the SPA image (installed as /etc/nginx/conf.d/dawnlit.conf, i.e.
# inside the stock http{} block of nginx:1.27-alpine, which already includes mime.types and logs to
# stdout/stderr).
#
#  • serves the Vite build (SPA fallback to /index.html)
#  • hashed /assets/* cached 1 year (immutable); index.html revalidated on every load (no-cache)
#  • same-origin reverse proxy: /api/, /media/, /sitemap.xml, /robots.txt → backend:8000
#  • security headers on everything nginx serves itself; proxied responses keep the API's own
#    headers (app/core/middleware.py) so nothing is duplicated
#  • TLS is terminated in front of this container (Caddy/Traefik/LB — see docs/DEPLOYMENT.md)

# ----- logging without query strings / referrers (order-tracking tokens live in URLs; PLAN §6.6) -----
map $request_uri $dl_path_only {
    "~^(?<dl_p>[^?]*)"  $dl_p;
    default             $request_uri;
}
log_format dl_main '$remote_addr - [$time_local] "$request_method $dl_path_only $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time ua="$http_user_agent"';

# ----- X-Forwarded-Proto: keep the TLS terminator's value, else our own scheme -----
map $http_x_forwarded_proto $dl_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ----- which URIs are answered by the backend (it sets its own security headers) -----
map $uri $dl_from_backend {
    default        0;
    ~^/api/        1;
    ~^/media/      1;
    /sitemap.xml   1;
    /robots.txt    1;
}

# ----- Cache-Control by path (an empty value means "do not add the header") -----
map $uri $dl_cache_control {
    default                                          "no-cache";
    ~^/assets/                                       "public, max-age=31536000, immutable";
    ~^/media/                                        "public, max-age=86400";
    ~^/api/                                          "";
    /sitemap.xml                                     "";
    /robots.txt                                      "";
    "~*\.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?)$" "public, max-age=604800";
    /manifest.webmanifest                            "public, max-age=86400";
}

# ----- Content-Security-Policy -----
# Fonts are self-hosted (@fontsource-variable), so no Google Fonts hosts. Razorpay checkout.js is
# loaded from checkout.razorpay.com and opens its iframe on api.razorpay.com.
# 'unsafe-inline' for styles only: index.html has a critical inline <style> and Framer Motion writes
# inline style attributes. No inline scripts are allowed.
# When GA4 / Meta Pixel are enabled (VITE_GA_ID / VITE_META_PIXEL_ID) use the extended policy below
# (see docs/LAUNCH_CHECKLIST.md → Analytics) and add `upgrade-insecure-requests` once on HTTPS.
map $dl_from_backend $dl_csp {
    1       "";
    default "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.razorpay.com; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'";
    # Analytics-enabled variant (replace the default above when GA4 + Meta Pixel are switched on):
    # default "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.razorpay.com https://*.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.facebook.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com https://www.facebook.com; frame-ancestors 'none'; upgrade-insecure-requests";
}
map $dl_from_backend $dl_nosniff          { 1 ""; default "nosniff"; }
map $dl_from_backend $dl_referrer_policy  { 1 ""; default "strict-origin-when-cross-origin"; }
map $dl_from_backend $dl_frame_options    { 1 ""; default "DENY"; }
# same-origin-allow-popups: Razorpay may open popups (UPI apps, 3-D Secure, netbanking).
map $dl_from_backend $dl_coop             { 1 ""; default "same-origin-allow-popups"; }
map $dl_from_backend $dl_permissions_policy {
    1       "";
    default 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=(), payment=(self "https://api.razorpay.com" "https://checkout.razorpay.com")';
}

# ----- real client IP when running behind the TLS terminator on the docker network -----
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log dl_main;

    # Must stay ≥ the backend's upload limit (app/core/images.py MAX_UPLOAD_BYTES = 8 MiB) + multipart overhead.
    client_max_body_size 10m;

    # ----- compression (gzip only: the stock nginx:alpine image has no brotli module) -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

    # ----- headers (an empty map value suppresses the header) -----
    add_header Cache-Control           $dl_cache_control always;
    add_header Content-Security-Policy $dl_csp always;
    add_header X-Content-Type-Options  $dl_nosniff always;
    add_header Referrer-Policy         $dl_referrer_policy always;
    add_header X-Frame-Options         $dl_frame_options always;
    add_header Cross-Origin-Opener-Policy $dl_coop always;
    add_header Permissions-Policy      $dl_permissions_policy always;
    # HSTS: enable at the TLS terminator (preferred) or here once the site is HTTPS-only for good.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ----- reverse proxy to FastAPI (re-resolved through Docker DNS, so nginx starts even if the
    #       backend is restarting and follows its new IP) -----
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dl_backend "backend:8000";

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (do not append) so clients cannot spoof the IP the API rate-limits on.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $dl_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://$dl_backend;
    }

    location ^~ /media/ {
        proxy_pass http://$dl_backend;
    }

    location = /sitemap.xml {
        proxy_pass http://$dl_backend;
    }

    location = /robots.txt {
        proxy_pass http://$dl_backend;
    }

    # Content-hashed build output: serve or 404 (never fall back to index.html for a missing chunk).
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hidden files (.git, .env …) are never served.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # SPA: every other path renders index.html; React Router handles 404s client-side.
    location / {
        try_files $uri /index.html;
    }
}
