          type: string
          format: email
          maxLength: 254
        full_name:
          anyOf:
            - type: string
            - type: "null"
        phone:
          anyOf:
            - type: string
              pattern: "^\\+91[6-9][0-9]{9}$"
            - type: "null"
          description: Indian mobile in E.164 (+91XXXXXXXXXX).
        role:
          "$ref": "#/components/schemas/UserRole"
        email_verified:
          type: boolean
        has_password:
          type: boolean
          description: False for OTP-only accounts.
        marketing_opt_in:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - full_name
        - phone
        - role
        - email_verified
        - has_password
        - marketing_opt_in
        - created_at
      additionalProperties: false
    UserProfileUpdate:
      type: object
      description: Partial profile update. Email is immutable.
      x-py-module: app.schemas.users
      properties:
        full_name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
        phone:
          anyOf:
            - type: string
              pattern: "^\\+91[6-9][0-9]{9}$"
            - type: "null"
          description: Indian mobile in E.164 (+91XXXXXXXXXX).
        marketing_opt_in:
          anyOf:
            - type: boolean
            - type: "null"
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      description: "Set or change password. `current_password` required when the account already has one."
      x-py-module: app.schemas.users
      properties:
        current_password:
          anyOf:
            - type: string
              maxLength: 128
            - type: "null"
        new_password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - new_password
      additionalProperties: false
    AddressInput:
      type: object
      description: "Address payload (used for create and for inline checkout addresses). `state` name is derived from `state_code`."
      x-py-module: app.schemas.users
