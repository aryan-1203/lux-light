            - type: string
              pattern: "^\\+91[6-9][0-9]{9}$"
            - type: "null"
          description: Indian mobile in E.164 (+91XXXXXXXXXX).
        marketing_opt_in:
          type: boolean
          default: false
      required:
        - email
        - password
        - full_name
      additionalProperties: false
    LoginRequest:
      type: object
