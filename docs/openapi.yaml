paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Liveness/readiness probe
      x-auth: none
      x-csrf: false
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  /sitemap.xml:
    get:
      operationId: getSitemap
      tags:
        - seo
      summary: "XML sitemap (served by backend at site root; nginx/Vite proxy it)"
      description: "Includes /, /shop, /shop/{category}, /products/{slug}, /science, /quiz, /blog, /blog/{slug}, /faq, /contact, /policies/*. Absolute URLs use PUBLIC_SITE_URL."
      x-auth: none
      x-csrf: false
      security: []
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                type: string
  /robots.txt:
    get:
      operationId: getRobotsTxt
      tags:
        - seo
      summary: robots.txt (disallows /admin, /account, /checkout, /cart, /api)
      x-auth: none
      x-csrf: false
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/csrf:
    get:
      operationId: issueCsrfToken
      tags:
        - auth
      summary: Issue CSRF token cookie
      x-auth: none
      x-csrf: false
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfTokenResponse"
          headers:
            Set-Cookie:
              description: "Sets readable `dl_csrf` cookie (not httpOnly, SameSite=Lax, 7 d)."
              schema:
                type: string
  /api/v1/auth/signup:
    post:
      operationId: signup
      tags:
        - auth
      summary: Sign up with email + password (logs in)
      description: |-
        409 AUTH_EMAIL_TAKEN.

        **Rate limit:** 5 per 10 min per IP (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: none
      x-csrf: true
      x-rate-limit: "5 per 10 min per IP"
      security:
        - csrfHeader: []
      parameters:
        - "$ref": "#/components/parameters/CartCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: "Sets `dl_access` (httpOnly, 15 min), `dl_refresh` (httpOnly, 30 d, Path=/api/v1/auth), refreshes `dl_csrf`; clears `dl_cart` after merging."
              schema:
                type: string
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Log in with email + password
      description: |-
        401 AUTH_INVALID_CREDENTIALS; 403 AUTH_ACCOUNT_DISABLED. Guest cart is merged.

        **Rate limit:** 10 per 5 min per IP and 5 per 5 min per email (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: none
      x-csrf: true
      x-rate-limit: "10 per 5 min per IP and 5 per 5 min per email"
      security:
        - csrfHeader: []
      parameters:
        - "$ref": "#/components/parameters/CartCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: "Sets `dl_access` (httpOnly, 15 min), `dl_refresh` (httpOnly, 30 d, Path=/api/v1/auth), refreshes `dl_csrf`; clears `dl_cart` after merging."
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags:
        - auth
      summary: Send a login OTP to an email
      description: |-
        Always 202 (no enumeration). Code: 6 digits, valid 10 min, max 5 attempts.

        **Rate limit:** 3 per 10 min per email and 10 per hour per IP (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: none
      x-csrf: true
      x-rate-limit: "3 per 10 min per email and 10 per hour per IP"
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OtpSendRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpSendResponse"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  /api/v1/auth/otp/verify:
