      operationId: verifyOtp
      tags:
        - auth
      summary: Verify OTP and log in (creates account if new)
      description: |-
        400 AUTH_OTP_INVALID | AUTH_OTP_EXPIRED; 429 AUTH_OTP_TOO_MANY_ATTEMPTS.

        **Rate limit:** 10 per 10 min per email (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: none
      x-csrf: true
      x-rate-limit: "10 per 10 min per email"
      security:
        - csrfHeader: []
      parameters:
        - "$ref": "#/components/parameters/CartCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: "Sets `dl_access` (httpOnly, 15 min), `dl_refresh` (httpOnly, 30 d, Path=/api/v1/auth), refreshes `dl_csrf`; clears `dl_cart` after merging."
              schema:
                type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - auth
      summary: Rotate refresh token and issue a new access token
      description: |-
        Refresh tokens rotate on every use; presenting a revoked token revokes the whole family (401 AUTH_REFRESH_INVALID).

        **Rate limit:** 30 per min per IP (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: none
      x-csrf: true
      x-rate-limit: "30 per min per IP"
      security:
        - refreshCookie: []
          csrfHeader: []
      parameters:
        - "$ref": "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: "Sets `dl_access` (httpOnly, 15 min), `dl_refresh` (httpOnly, 30 d, Path=/api/v1/auth), refreshes `dl_csrf`; clears `dl_cart` after merging."
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Log out (revoke refresh token, clear cookies)
      description: "**CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie."
      x-auth: optional
      x-csrf: true
      security:
        - csrfHeader: []
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - "$ref": "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: Clears dl_access, dl_refresh and dl_cart.
              schema:
                type: string
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
