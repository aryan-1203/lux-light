      summary: Set or change password
      description: |-
        400 AUTH_PASSWORD_INCORRECT. Revokes all other refresh tokens.

        **Rate limit:** 5 per 10 min per user (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
