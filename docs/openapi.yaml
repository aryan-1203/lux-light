      x-py-module: app.schemas.auth
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    OtpSendRequest:
      type: object
      description: Request a 6-digit email OTP for passwordless login.
      x-py-module: app.schemas.auth
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email
      additionalProperties: false
    OtpSendResponse:
      type: object
      description: Always returned (no account enumeration).
      x-py-module: app.schemas.auth
      properties:
        message:
          type: string
        expires_in_seconds:
          type: integer
        resend_after_seconds:
          type: integer
        dev_code:
          anyOf:
            - type: string
            - type: "null"
          description: "Only populated when ENV != production AND OTP_DEV_ECHO=true (tests/e2e). Always null in production."
      required:
        - message
        - expires_in_seconds
        - resend_after_seconds
        - dev_code
      additionalProperties: false
    OtpVerifyRequest:
      type: object
      description: Verify an email OTP. Creates the account if the email is new (passwordless signup).
      x-py-module: app.schemas.auth
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - email
        - code
      additionalProperties: false
    AuthResponse:
      type: object
      description: "Session established; access/refresh cookies are set on the response."
