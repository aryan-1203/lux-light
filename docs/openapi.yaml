        - "$ref": "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuditLogPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  /api/v1/admin/exports/orders.csv:
    get:
      operationId: adminExportOrdersCsv
      tags:
        - admin-exports
      summary: Export orders CSV
      description: |-
        Columns: order_number, placed_at_ist, status, payment_method, payment_status, customer_name, email, phone, ship_state, subtotal, discount, shipping, cod_fee, total, taxable_value, cgst, sgst, igst, promo_codes, invoice_number, awb (money in rupees with 2 decimals). Cells starting with = + - @ are prefixed with ' (CSV injection). Audited.

        **Roles:** admin.
      x-auth: required
      x-roles:
        - admin
      x-csrf: false
      security:
        - cookieAuth: []
      parameters:
        - "$ref": "#/components/parameters/DateFrom"
        - "$ref": "#/components/parameters/DateTo"
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - "$ref": "#/components/schemas/OrderStatus"
              - type: "null"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: "attachment; filename=\"<name>-YYYYMMDD.csv\""
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  /api/v1/admin/exports/customers.csv:
    get:
      operationId: adminExportCustomersCsv
      tags:
        - admin-exports
      summary: Export customers CSV
      description: |-
        Columns: id, email, full_name, phone, marketing_opt_in, orders_count, total_spent, last_order_at_ist, created_at_ist. Audited.

        **Roles:** admin.
      x-auth: required
      x-roles:
        - admin
      x-csrf: false
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: "attachment; filename=\"<name>-YYYYMMDD.csv\""
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  /api/v1/admin/exports/inventory.csv:
    get:
      operationId: adminExportInventoryCsv
      tags:
        - admin-exports
      summary: Export inventory CSV
      description: |-
        Columns: sku, product, variant, on_hand, reserved, available, low_stock_threshold, price, last_landed_unit_cost (admin only; blank for staff). Audited.

        **Roles:** admin, staff.
      x-auth: required
      x-roles:
        - admin
        - staff
      x-csrf: false
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: "attachment; filename=\"<name>-YYYYMMDD.csv\""
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dl_access
      description: httpOnly JWT access cookie.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the dl_csrf cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: dl_refresh
      description: httpOnly refresh cookie.
    razorpaySignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: HMAC-SHA256 of the raw body with RAZORPAY_WEBHOOK_SECRET.
    shippingWebhookToken:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Shared secret SHIPPING_WEBHOOK_TOKEN.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Inclusive IST date.
      schema:
        anyOf:
          - type: string
            format: date
          - type: "null"
    DateTo:
      name: date_to
      in: query
      required: false
      description: Inclusive IST date.
      schema:
        anyOf:
          - type: string
            format: date
          - type: "null"
    CartCookie:
      name: dl_cart
      in: cookie
      required: false
      description: Signed guest cart token (ignored for logged-in users except for merge on login).
      schema:
        anyOf:
          - type: string
          - type: "null"
    RefreshCookie:
      name: dl_refresh
      in: cookie
      required: false
      description: Opaque refresh token.
      schema:
        anyOf:
          - type: string
          - type: "null"
  responses:
    BadRequest:
      description: Bad request (e.g. PAYMENT_SIGNATURE_INVALID, AUTH_OTP_INVALID).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not authenticated (UNAUTHENTICATED, AUTH_TOKEN_EXPIRED, AUTH_INVALID_CREDENTIALS, AUTH_REFRESH_INVALID).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden (FORBIDDEN, CSRF_FAILED, ORDER_ACCESS_DENIED, AUTH_ACCOUNT_DISABLED).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (*_NOT_FOUND)."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: "State conflict (e.g. INSUFFICIENT_STOCK, INVALID_STATUS_TRANSITION, *_TAKEN)."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Upload too large (IMAGE_TOO_LARGE).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: "Validation or business-rule failure (VALIDATION_ERROR, PROMO_*, COD_*, ...)."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limited (RATE_LIMITED, AUTH_OTP_TOO_MANY_ATTEMPTS).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
    BadGateway:
      description: Upstream provider failure (PAYMENT_GATEWAY_ERROR, SHIPPING_PROVIDER_ERROR, REFUND_GATEWAY_ERROR).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    UserRole:
      type: string
      enum:
        - customer
        - staff
        - admin
      description: "Role used for RBAC. `admin` ⊃ `staff` ⊃ `customer`."
      x-py-module: app.models.enums
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - packed
        - shipped
        - out_for_delivery
        - delivered
        - cancelled
        - refunded
        - returned
      description: "Order lifecycle status. See docs/PLAN.md §Order state machine for allowed transitions. A COD order stays `pending` until packed (it is fulfilable while pending)."
      x-py-module: app.models.enums
    PaymentStatus:
      type: string
      enum:
        - created
        - authorized
        - captured
        - failed
        - refunded
        - partially_refunded
      description: Payment state (used on payments rows and as the order-level payment summary).
      x-py-module: app.models.enums
    PaymentMethod:
      type: string
      enum:
        - razorpay
        - cod
      description: Customer-selected payment method.
      x-py-module: app.models.enums
    PaymentProvider:
      type: string
      enum:
        - razorpay
        - mock
        - cod
      description: Which provider processed a payment row.
      x-py-module: app.models.enums
    GatewayMode:
      type: string
      enum:
        - razorpay
        - mock
      description: "Online gateway mode. `mock` when Razorpay keys are not configured."
      x-py-module: app.models.enums
    CheckoutNextAction:
      type: string
      enum:
        - pay
        - confirmed
      description: "`pay` → open Razorpay/mock checkout with `payment`; `confirmed` → COD order placed, go to success page."
      x-py-module: app.models.enums
    MockPaymentOutcome:
      type: string
      enum:
        - success
        - failure
      description: Outcome to simulate in the mock gateway.
      x-py-module: app.models.enums
    DiscountType:
      type: string
      enum:
        - percentage
        - flat
      description: Promo discount type.
      x-py-module: app.models.enums
    ShipmentStatus:
      type: string
      enum:
        - created
        - pickup_scheduled
        - picked_up
        - in_transit
        - out_for_delivery
        - delivered
        - failed_delivery
        - rto_initiated
        - rto_delivered
        - cancelled
      description: Normalised courier shipment status.
      x-py-module: app.models.enums
    ShippingProvider:
      type: string
      enum:
        - mock
        - shiprocket
      description: Shipping adapter that booked a shipment.
      x-py-module: app.models.enums
    RefundStatus:
      type: string
      enum:
        - pending
        - processed
        - failed
      description: Refund state.
      x-py-module: app.models.enums
    RefundMethod:
      type: string
      enum:
        - gateway
