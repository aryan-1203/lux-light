        details:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
          description: "Optional structured context. VALIDATION_ERROR → {\"fields\": [{\"loc\": [...], \"msg\": str, \"type\": str}]}; PROMO_MIN_ORDER → {\"min_order_paise\", \"shortfall_paise\"}; PRICE_CHANGED → {\"expected_total_paise\", \"actual_total_paise\"}; INSUFFICIENT_STOCK → {\"variant_ids\": [...]}"
