openapi: "3.1.0"
info:
  title: Dawnlit API
  version: "1.0.0"
  summary: D2C storefront + admin API for Dawnlit 10,000 lux light therapy lamps (India).
  description: |-
    Contract (source of truth) for the Dawnlit storefront + admin API. Backend Pydantic class names equal the
    component schema names below and every FastAPI route sets `operation_id` to the `operationId` here.

    **Conventions**
    - Money: integer paise, fields named `*_paise`. Prices are GST-inclusive.
    - Timestamps: ISO-8601 UTC (`format: date-time`). Dates (`format: date`) are IST calendar dates.
    - IDs: integers. Public URLs use slugs / order numbers.
    - Errors (all non-2xx): `{"error": {"code": "STRING_CODE", "message": "...", "details": {...}|null}}` → `ErrorResponse`.
    - Pagination: `page` (1-based), `page_size` (default 20, max 100) → `{items, page, page_size, total}` (concrete `*Page` schemas).
    - Nullable fields are always present in responses (value may be null).

    **Cookies**
    | cookie | httpOnly | purpose |
    |---|---|---|
    | `dl_access` | yes | JWT access token (HS256, 15 min). Path=/ |
    | `dl_refresh` | yes | Opaque rotating refresh token (30 d). Path=/api/v1/auth |
    | `dl_cart` | yes | Signed guest cart token (60 d). Path=/ |
    | `dl_csrf` | **no** | CSRF double-submit token (7 d). Path=/ |
    All cookies: `SameSite=Lax`, `Secure` when ENV=production.

    **CSRF**: every POST/PUT/PATCH/DELETE under /api/v1 must send `X-CSRF-Token` equal to the `dl_csrf` cookie
    (403 CSRF_FAILED otherwise). Exempt: `/api/v1/payments/webhook/*`, `/api/v1/shipping/webhook/*`.
    Obtain the cookie via `GET /api/v1/auth/csrf`.

    **Extensions**: `x-auth` (none|optional|required), `x-roles`, `x-csrf`, `x-rate-limit` on operations;
    `x-py-module` on schemas (the Pydantic module that defines the class).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
