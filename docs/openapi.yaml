        - duplicate
      additionalProperties: false
    CsrfTokenResponse:
      type: object
      description: "CSRF token; the same value is set in the readable `dl_csrf` cookie."
      x-py-module: app.schemas.auth
      properties:
        csrf_token:
          type: string
      required:
        - csrf_token
      additionalProperties: false
    SignupRequest:
      type: object
      description: Email + password signup.
      x-py-module: app.schemas.auth
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: "≥8 chars, must contain a letter and a digit."
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
