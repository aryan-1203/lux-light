  /api/v1/checkout:
    post:
      operationId: createCheckout
      tags:
        - checkout
      summary: Create an order from the cart (reserves stock)
      description: |-
        Steps: re-price cart → validate address/pincode/COD → lock promos → reserve stock (FOR UPDATE, 15 min) → create order + payment.

        Errors: 409 CART_EMPTY | INSUFFICIENT_STOCK | OUT_OF_STOCK | PRICE_CHANGED; 422 ADDRESS_REQUIRED | EMAIL_REQUIRED | PINCODE_NOT_SERVICEABLE | COD_NOT_AVAILABLE | COD_LIMIT_EXCEEDED | PROMO_*; 404 ADDRESS_NOT_FOUND; 502 PAYMENT_GATEWAY_ERROR.

        Online: order `pending`, payment `created`, returns `payment` payload. COD: order `pending` + payment_method cod, stock committed immediately, cart cleared, next_action `confirmed`.

        **Rate limit:** 10 per min per IP (429 RATE_LIMITED with Retry-After).

        **CSRF:** requires header `X-CSRF-Token` equal to the `dl_csrf` cookie.
      x-auth: optional
