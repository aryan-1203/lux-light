# Dawnlit — one-command local stack:   cp .env.example .env && docker compose up --build
#
#   Storefront + admin   http://localhost:8080          (admin at /admin)
#   API docs (Swagger)   http://localhost:8080/api/docs
#   Health               http://localhost:8080/api/v1/health
#
# Mock payments / shipping / email / WhatsApp are the defaults (empty credentials in .env), and
# SEED_ON_START=true loads demo data (idempotent) on every backend start.
# Production: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d` (docs/DEPLOYMENT.md).
#
# Requires Docker Compose v2.24+ (env_file `required: false`, build `additional_contexts`).

name: dawnlit

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-dawnlit-backend:local}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - storage:/app/storage
  networks: [internal]
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-backend-env: &backend-env
  # Docker-network wiring (everything else comes from .env, falling back to app defaults).
  DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-dawnlit}:${MYSQL_PASSWORD:-change-me-local}@mysql:3306/${MYSQL_DATABASE:-luxlight}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STORAGE_DIR: /app/storage
  ENV: ${ENV:-development}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luxlight}
      MYSQL_USER: ${MYSQL_USER:-dawnlit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      # TCP ping so the temporary init server (socket-only) does not count as healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only rate-limit counters live here: no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  backend:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        infra: ./infra
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ARGS: ${SEED_ARGS:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Not published: reach the API through nginx (http://localhost:8080/api/…). uvicorn trusts
    # X-Forwarded-For from any peer, so :8000 must never be exposed directly.
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # first start runs migrations + demo seeds (renders placeholder product images)
      start_period: 180s

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      <<: *backend-env
      SEED_ON_START: "false"
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy   # migrations have run
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 60s   # SIGTERM lets the current job finish

  frontend:
    image: ${FRONTEND_IMAGE:-dawnlit-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MOCK: "false"
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        VITE_ENABLE_3D: ${VITE_ENABLE_3D:-false}
        VITE_GA_ID: ${VITE_GA_ID:-}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
    restart: unless-stopped
    ports:
      # Local: http://localhost:8080. Production sets FRONTEND_PUBLISH=127.0.0.1:8080 (TLS proxy in front).
      - "${FRONTEND_PUBLISH:-8080}:80"
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

networks:
  internal:
    name: dawnlit_internal

volumes:
  mysql-data:
  storage:
