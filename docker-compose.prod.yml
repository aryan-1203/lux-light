# Production override (single VM). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
# See docs/DEPLOYMENT.md. Required in .env (startup refuses otherwise): ENV=production, SECRET_KEY,
# MOCK_PAYMENT_SECRET, SHIPPING_WEBHOOK_TOKEN, PAYMENT_PROVIDER=razorpay + RAZORPAY_* keys,
# MYSQL_* passwords, SITE_DOMAIN, CORS_ORIGINS / PUBLIC_SITE_URL / VITE_SITE_URL = https://<domain>,
# FRONTEND_PUBLISH=127.0.0.1:8080 (only Caddy is public).

services:
  backend:
    environment:
      ENV: production
      # Never seed on start in production (a deleted seed product would come back). Seed the
      # essentials once, explicitly:  docker compose … run --rm backend seed --essential
      # (demo data is refused in production anyway).
      SEED_ON_START: "false"
      LOG_JSON: "true"
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    environment:
      ENV: production
      LOG_JSON: "true"
    deploy:
      resources:
        limits:
          memory: 512m

  mysql:
    deploy:
      resources:
        limits:
          memory: 1g

  # TLS terminator with automatic Let's Encrypt certificates. Only ports 80/443 are public.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN (e.g. www.example.in) in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt notices in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
